<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>バルーン集計 管理</title>
  <meta name="theme-color" content="#fcfcfb">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-page">
  <header class="admin-head">
    <h1>バルーン集計</h1>
    <div class="filters">
      <button id="prev-day" class="btn" type="button" aria-label="前の日">‹</button>
      <input id="date" type="date" aria-label="日付">
      <button id="next-day" class="btn" type="button" aria-label="次の日">›</button>
      <button id="today-btn" class="btn" type="button">今日</button>
      <label class="check"><input id="all-days" type="checkbox"> 全期間</label>
    </div>
    <div class="head-actions">
      <span id="status" class="muted"></span>
      <button id="reload-btn" class="btn" type="button">更新</button>
      <button id="csv-btn" class="btn" type="button">CSV ダウンロード</button>
      <a class="btn" href="index.html">入力画面</a>
    </div>
  </header>

  <p id="demo-banner" class="banner" hidden>
    デモモード：サーバー未設定のため、このブラウザの中に保存された記録だけを表示しています。
  </p>
  <p id="alert" class="banner banner-warn" hidden></p>

  <main class="admin-main">
    <section id="tiles" class="tiles" aria-label="合計"></section>

    <section class="card card-full">
      <h2>時間帯別の個数</h2>
      <div class="split">
        <div id="hour-chart"></div>
        <div class="table-wrap"><table id="hour-table" class="num-table"></table></div>
      </div>
    </section>

    <section class="card card-full">
      <h2>色別の使用数</h2>
      <p class="note">2色の種類は、使った色それぞれを 1 と数えます（同じ色を 2 回なら 2）。</p>
      <div class="table-wrap"><table id="color-table" class="num-table"></table></div>
    </section>

    <section class="card">
      <h2>2色の組み合わせ</h2>
      <div class="table-wrap scroll-y"><table id="combo-table"></table></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>記録一覧</h2>
        <label class="check"><input id="show-deleted" type="checkbox" checked> 取り消し済みも表示</label>
      </div>
      <div class="table-wrap scroll-y"><table id="record-table"></table></div>
    </section>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>

  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
