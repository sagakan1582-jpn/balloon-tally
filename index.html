<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>バルーン集計 入力</title>
  <meta name="theme-color" content="#fcfcfb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="input-page">
  <header class="topbar">
    <h1>バルーン集計</h1>
    <div class="topbar-right">
      <span class="today">今日 <strong id="today-count">–</strong> 個</span>
      <span id="sync-status" class="pill"></span>
    </div>
  </header>

  <p id="demo-banner" class="banner" hidden>
    デモモード：サーバー未設定のため、このブラウザの中だけに保存されます。
  </p>
  <p id="alert" class="banner banner-warn" hidden></p>

  <main class="input-main">
    <section>
      <h2>種類</h2>
      <div id="items" class="item-grid"></div>
    </section>

    <section>
      <h2>色 <span id="color-hint" class="hint"></span></h2>
      <div id="colors" class="color-grid"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>この端末の直近の登録</h2>
        <label class="check"><input id="show-voided" type="checkbox" checked> 取り消し済みも表示</label>
      </div>
      <ul id="recent" class="recent"></ul>
    </section>

    <footer class="page-foot">
      <button id="device-btn" class="link-btn" type="button"></button>
      <a href="admin.html">集計を見る</a>
    </footer>
  </main>

  <div class="action-bar">
    <div id="toast" class="toast" role="status" hidden></div>
    <div id="summary" class="summary"></div>
    <div class="action-row">
      <button id="clear-btn" class="btn" type="button">クリア</button>
      <button id="submit-btn" class="btn btn-primary" type="button" disabled>登録する</button>
    </div>
  </div>

  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/input.js"></script>
</body>
</html>
